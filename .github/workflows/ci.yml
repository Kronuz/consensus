# A failed groups_upload on a macOS runner prints a spindump of its stuck connection loop with raw
# kernel frames (kernel + 0xN) and the OS build, kernel UUID and slide. Symbolicate offline against
# the matching Kernel Debug Kit (Apple developer login); CI downloads none. See
# docs/mechanisms/host-transport.md, Checks.
name: CI
on:
  push:
    branches: [main, master, 'quest/**']
  pull_request:
  workflow_dispatch:
    inputs:
      nightly: { type: boolean, default: false }
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      nightly: ${{ inputs.nightly || false }}
