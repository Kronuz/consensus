# Probe for groups-upload-loop-stall (never lands): first the capture itself, upload with host
# 1's connection loop held 1.3 s (GROUPS_UPLOAD_HOLD_MS) under GITHUB_ACTIONS; on macos-15-intel. When upload's connection loop is stuck
# 250 ms the test starts spindump on itself (GROUPS_PROBE_SPINDUMP): the stuck thread's kernel
# stack names what write(2) waits on.
name: CI
on:
  workflow_dispatch:
    inputs:
      nightly: { type: boolean, default: false }
jobs:
  probe:
    name: probe-${{ matrix.shard }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        env: { CC: clang, CXX: clang++ }
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g" "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Probe
        run: |
          set +e
          sysctl kern.ipc.mb_uses_mcache kern.ipc.nmbclusters kern.ipc.njcl hw.memsize hw.ncpu
          sudo -n true && echo "sudo: yes"
          sw_vers; ctest --test-dir build -R '^consensus_tls_certificates$' > /dev/null
          (cd build && GITHUB_ACTIONS=true GROUPS_UPLOAD_HOLD_MS=1300 ./consensus_transport_groups_test tls-fixture upload > ../hold.txt 2>&1; echo "hold rc $?")
          grep -E 'longest gap|age [0-9]{3}' hold.txt | cut -c1-300 | head -4
          grep -E '^upload: (spindump|kernel build)' hold.txt
          grep -c 'kernel + 0x' hold.txt; grep -E 'kernel \+ 0x' hold.txt | head -12
          grep -c '??? (kernel' hold.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spindump-${{ matrix.shard }}
          path: |
            spindump-*.txt
            build/spindump-upload-*
          if-no-files-found: ignore
