# Probe only (probe/detent/fetch-stall, never lands): rpc_host_fetch inside whole suites, as CI runs it.
name: probe-fetch
on:
  push:
    branches: ['probe/detent/fetch-stall']
  workflow_dispatch:
env:
  CMAKE_GENERATOR: Ninja
jobs:
  suites:
    name: ${{ matrix.name }} shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-x86_64, os: macos-15-intel, shard: 1, minutes: 120 }
          - { name: macos-x86_64, os: macos-15-intel, shard: 2, minutes: 120 }
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: brew install ninja
      - name: Configure
        env: { CC: clang, CXX: clang++ }
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g" "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Suites
        # Whole suites, ctest --parallel 2 as CI runs them, until the time is up; each suite's fetch lines.
        run: |
          sysctl hw.ncpu hw.memsize kern.ipc.nmbclusters 2>/dev/null || true
          end=$(( $(date +%s) + ${{ matrix.minutes }} * 60 )); i=0; failed=0
          while [ $(date +%s) -lt $end ]; do
            i=$((i + 1))
            ctest --test-dir build --no-tests=ignore --parallel 2 > suite.log 2>&1 || true
            log=build/Testing/Temporary/LastTest.log
            echo "suite $i: $(grep -o 'tests passed.*' suite.log) | $(grep -o 'rpc_host_fetch .*sec' suite.log | tr -s ' .' ' ')"
            grep -m1 '^fetch: ' "$log" || echo 'fetch: NO LINE'
            grep -m1 "^probe: one's loop" "$log" || true
            grep -E '\*\*\*|Failed  ' suite.log | sed "s/^/suite $i failed: /" || true
            if grep -q 'rpc_host_fetch .*\*\*\*' suite.log; then
              failed=$((failed + 1))
              echo "::group::suite $i fetch output"
              awk '/rpc_host_test.*fetch/{p=1} p&&/^----------------------------------------------------------$/{c++} p&&c>=2{exit} p' "$log" | head -400
              echo "::endgroup::"
              vm_stat | head -12; netstat -m | head -12
            fi
          done
          echo "fetch failed in $failed of $i suites"
          [ "$failed" = 0 ]
      - name: Spindumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spindump-${{ matrix.name }}-${{ matrix.shard }}
          path: build/**/spindump-fetch-*
          if-no-files-found: ignore
          retention-days: 14
